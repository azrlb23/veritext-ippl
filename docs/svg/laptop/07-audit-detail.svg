t><rect x="167.2" y="152" width="62.199999999999996" height="22" rx="11" fill="#16a34a" fill-opacity="0.12"/><text x="198.29999999999998" y="167" font-size="11" font-weight="600" fill="#16a34a" text-anchor="middle">Selesai</text><text x="245.39999999999998" y="168" font-size="12.5" font-weight="400" fill="#6b7280" text-anchor="start">Diaudit 03 Nov 2026, 09:12 WIB · 4.218 kata</text><rect x="1120.5" y="100.5" width="255" height="43" rx="8" fill="#17191c" stroke="#17191c" stroke-width="1"/><text x="1248" y="126.86" font-size="13.5" font-weight="600" fill="#fff" text-anchor="middle">⤓  Unduh Sertifikat PDF Resmi</text><rect x="1120.5" y="154.5" width="255" height="33" rx="8" fill="#fff" stroke="#fca5a5" stroke-width="1"/><text x="1248" y="175.68" font-size="13" font-weight="600" fill="#b91c1c" text-anchor="middle">Hapus naskah</text><rect x="64.5" y="208.5" width="743" height="743" rx="8" fill="#ffffff" stroke="#ededed" stroke-width="1"/><text x="88" y="240" font-size="12.5" font-weight="400" fill="#6b7280" text-anchor="start">Tampilkan:</text><rect x="160.5" y="224.5" width="126" height="32" rx="16" fill="#fff" stroke="#d4d4d4" stroke-width="1"/><rect x="172" y="235" width="12" height="12" rx="3" fill="#ef4444"/><path d="M174.8 241l2.4000000000000004 2.4000000000000004 4-4.800000000000001" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="192" y="245" font-size="12.5" font-weight="500" fill="#17191c" text-anchor="start">Leksikal</text><rect x="298.5" y="224.5" width="126" height="32" rx="16" fill="#fff" stroke="#d4d4d4" stroke-width="1"/><rect x="310" y="235" width="12" height="12" rx="3" fill="#f97316"/><path d="M312.8 241l2.4000000000000004 2.4000000000000004 4-4.800000000000001" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="330" y="245" font-size="12.5" font-weight="500" fill="#17191c" text-anchor="start">Semantik</text><rect x="436.5" y="224.5" width="126" height="32" rx="16" fill="#fff" stroke="#d4d4d4" stroke-width="1"/><rect x="448" y="235" width="12" height="12" rx="3" fill="#eab308"/><path d="M450.8 241l2.4000000000000004 2.4000000000000004 4-4.800000000000001" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="468" y="245" font-size="12.5" font-weight="500" fill="#17191c" text-anchor="start">Stilometri AI</text><line x1="64" y1="272" x2="808" y2="272" stroke="#ededed" stroke-width="1"/><text x="88" y="306" font-size="14" font-weight="400" fill="#17191c" text-anchor="start" textLength="44.5" lengthAdjust="spacingAndGlyphs">BAB II</text><text x="88" y="366" font-size="14" font-weight="400" fill="#17191c" text-anchor="start" textLength="244.9" lengthAdjust="spacingAndGlyphs">Perubahan iklim global merupakan </text><rect x="332.9" y="352" width="333.9" height="20" rx="2" fill="#ef4444" fill-opacity="0.22"/><rect x="332.9" y="370" width="333.9" height="2" fill="#ef4444"/><text x="332.9" y="366" font-size="14" font-weight="400" fill="#17191c" text-anchor="start" textLength="333.9" lengthAdjust="spacingAndGlyphs">tantangan terbesar yang dihadapi umat manusia</text><text x="666.8" y="366" font-size="14" font-weight="400" fill="#17191c" text-anchor="start" textLength="37.1" lengthAdjust="spacingAndGlyphs"> pada</text><rect x="88" y="382" width="267.1" height="20" rx="2" fill="#ef4444" fill-opacity="0.22"/><rect x="88" y="400" width="267.1" height="2" fill="#ef4444"/><text x="88" y="396" font-size="14" font-weight="400" fill="#17191c" text-anchor="start" textLength="267.1" lengthAdjust="spacingAndGlyphs">abad ke-21 karena berdampak langsung</text><text x="355.1" y="396" font-size="14" font-weight="400" fill="#17191c" text-anchor="start" textLength="304.2" lengthAdjust="spacingAndGlyphs"> pada ketahanan pangan, ketersediaan air,</text><text x="88" y="426" font-size="14" font-weight="400" fill="#17191c" text-anchor="start" textLength="44.5" lengthAdjust="spacingAndGlyphs">serta </text><rect x="132.5" y="412" width="267.1" height="20" rx="2" fill="#f97316" fill-opacity="0.22"/><rect x="132.5" y="430" width="267.1" height="2" fill="#f97316"/><text x="132.5" y="426" font-size="14" font-weight="400" fill="#17191c" text-anchor="start" textLength="267.1" lengthAdjust="spacingAndGlyphs">kestabilan ekonomi negara berkembang</text><text x="399.6" y="426" font-size="14" font-weight="400" fill="#17191c" text-anchor="start" textLength="252.3" lengthAdjust="spacingAndGlyphs">. Berbagai studi menunjukkan bahwa</text><text x="88" y="456" font-size="14" font-weight="400" fill="#17191c" text-anchor="start" textLength="178.1" lengthAdjust="spacingAndGlyphs">kenaikan suhu rata-rata </text><rect x="266.1" y="442" width="311.6" height="20" rx="2" fill="#f97316" fill-opacity="0.22"/><rect x="266.1" y="460" width="311.6" height="2" fill="#f97316"/><text x="266.1" y="456" font-size="14" font-weight="400" fill="#17191c" text-anchor="start" textLength="311.6" lengthAdjust="spacingAndGlyphs">berkorelasi dengan penurunan produktivitas</text><text x="577.7" y="456" font-size="14" font-weight="400" fill="#17191c" text-anchor="start" textLength="118.7" lengthAdjust="spacingAndGlyphs"> lahan pertanian</text><text x="88" y="486" font-size="14" font-weight="400" fill="#17191c" text-anchor="start" textLength="133.6" lengthAdjust="spacingAndGlyphs">di wilayah tropis.</text><rect x="88" y="532" width="341.3" height="20" rx="2" fill="#eab308" fill-opacity="0.22"/><rect x="88" y="550" width="341.3" height="2" fill="#eab308"/><text x="88" y="546" font-size="14" font-weight="400" fill="#17191c" text-anchor="start" textLength="341.3" lengthAdjust="spacingAndGlyphs">Dalam konteks ini, penting untuk dicatat bahwa</text><text x="429.3" y="546" font-size="14" font-weight="400" fill="#17191c" text-anchor="start" textLength="237.4" lengthAdjust="spacingAndGlyphs"> mitigasi harus dilakukan secara</text><text x="88" y="576" font-size="14" font-weight="400" fill="#17191c" text-anchor="start" textLength="215.2" lengthAdjust="spacingAndGlyphs">terkoordinasi lintas sektor. </text><rect x="303.2" y="562" width="356.2" height="20" rx="2" fill="#eab308" fill-opacity="0.22"/><rect x="303.2" y="580" width="356.2" height="2" fill="#eab308"/><text x="303.2" y="576" font-size="14" font-weight="400" fill="#17191c" text-anchor="start" textLength="356.2" lengthAdjust="spacingAndGlyphs">Selain itu, perlu dipahami bahwa adaptasi petani</text><text x="659.4" y="576" font-size="14" font-weight="400" fill="#17191c" text-anchor="start" textLength="103.9" lengthAdjust="spacingAndGlyphs"> lokal menjadi</text><text x="88" y="606" font-size="14" font-weight="400" fill="#17191c" text-anchor="start" textLength="549.1" lengthAdjust="spacingAndGlyphs">kunci keberhasilan program ketahanan pangan nasional dalam jangka panjang.</text><text x="88" y="666" font-size="14" font-weight="400" fill="#17191c" text-anchor="start" textLength="623.3" lengthAdjust="spacingAndGlyphs">Penelitian ini menggunakan pendekatan kuantitatif dengan data panel dari 34 provinsi</text><text x="88" y="696" font-size="14" font-weight="400" fill="#17191c" text-anchor="start" textLength="192.9" lengthAdjust="spacingAndGlyphs">selama periode 2010–2023. </text><rect x="280.9" y="682" width="385.8" height="20" rx="2" fill="#ef4444" fill-opacity="0.22"/><rect x="280.9" y="700" width="385.8" height="2" fill="#ef4444"/><text x="280.9" y="696" font-size="14" font-weight="400" fill="#17191c" text-anchor="start" textLength="385.8" lengthAdjust="spacingAndGlyphs">Data dianalisis menggunakan regresi efek tetap untuk</text><text x="666.7" y="696" font-size="14" font-weight="400" fill="#17191c" text-anchor="start" textLength="59.4" lengthAdjust="spacingAndGlyphs"> menguji</text><rect x="88" y="712" width="415.5" height="20" rx="2" fill="#ef4444" fill-opacity="0.22"/><rect x="88" y="730" width="415.5" height="2" fill="#ef4444"/><text x="88" y="726" font-size="14" font-weight="400" fill="#17191c" text-anchor="start" textLength="415.5" lengthAdjust="spacingAndGlyphs">hubungan antara anomali curah hujan dan hasil panen padi</text><text x="503.5" y="726" font-size="14" font-weight="400" fill="#17191c" text-anchor="start" textLength="178.1" lengthAdjust="spacingAndGlyphs">, jagung, serta kedelai.</text><text x="88" y="786" font-size="14" font-weight="400" fill="#17191c" text-anchor="start" textLength="593.6" lengthAdjust="spacingAndGlyphs">Hasil awal mengindikasikan adanya efek ambang pada suhu di atas 32°C yang secara</text><text x="88" y="816" font-size="14" font-weight="400" fill="#17191c" text-anchor="start" textLength="578.8" lengthAdjust="spacingAndGlyphs">signifikan menurunkan hasil panen, terutama pada musim kemarau berkepanjangan.</text><text x="88" y="876" font-size="14" font-weight="400" fill="#17191c" text-anchor="start" textLength="608.4" lengthAdjust="spacingAndGlyphs">Temuan ini sejalan dengan kerangka adaptasi yang diusulkan pada bagian berikutnya.</text><text x="88" y="306" font-size="12" font-weight="700" fill="#6b7280" text-anchor="start" letter-spacing="1.2">BAB II</text><rect x="790" y="290" width="6" height="120" rx="3" fill="#ededed"/><line x1="832" y1="248" x2="1192" y2="248" stroke="#ededed" stroke-width="1"/><text x="892" y="233" font-size="14" font-weight="600" fill="#17191c" text-anchor="middle">Ringkasan</text><rect x="832" y="246" width="120" height="2.5" fill="#17191c"/><text x="1012" y="233" font-size="14" font-weight="500" fill="#6b7280" text-anchor="middle">Sumber</text><text x="1132" y="233" font-size="14" font-weight="500" fill="#6b7280" text-anchor="middle">Diff</text><rect x="832.5" y="262.5" width="543" height="689" rx="8" fill="#ffffff" stroke="#ededed" stroke-width="1"/><path d="M1004 392A100 100 0 0 1 1204 392" fill="none" stroke="#ededed" stroke-width="18" stroke-linecap="butt"/><path d="M1004 392A100 100 0 0 1 1068.9 298.3" fill="none" stroke="#f97316" stroke-width="18"/><text x="1104" y="384" font-size="40" font-weight="600" fill="#17191c" text-anchor="middle" class="s">38,6%</text><text x="1104" y="416" font-size="14" font-weight="600" fill="#f97316" text-anchor="middle">Waspada</text><text x="992" y="424" font-size="11" font-weight="400" fill="#6b7280" text-anchor="middle">0</text><text x="1216" y="424" font-size="11" font-weight="400" fill="#6b7280" text-anchor="middle">100</text><rect x="856" y="456" width="496" height="60" rx="8" fill="#f5f5f4"/><rect x="856" y="456" width="4" height="60" fill="#ef4444"/><text x="876" y="482" font-size="13.5" font-weight="600" fill="#17191c" text-anchor="start">Tier 1 · Leksikal</text><text x="876" y="502" font-size="12" font-weight="400" fill="#6b7280" text-anchor="start">Bobot 50%</text><rect x="1060" y="483" width="190" height="6" rx="3" fill="#ededed"/><rect x="1060" y="483" width="83.98" height="6" rx="3" fill="#ef4444"/><text x="1336" y="492" font-size="15" font-weight="600" fill="#17191c" text-anchor="end">44,2%</text><rect x="856" y="528" width="496" height="60" rx="8" fill="#f5f5f4"/><rect x="856" y="528" width="4" height="60" fill="#f97316"/><text x="876" y="554" font-size="13.5" font-weight="600" fill="#17191c" text-anchor="start">Tier 2 · Semantik</text><text x="876" y="574" font-size="12" font-weight="400" fill="#6b7280" text-anchor="start">Bobot 35%</text><rect x="1060" y="555" width="190" height="6" rx="3" fill="#ededed"/><rect x="1060" y="555" width="68.39999999999999" height="6" rx="3" fill="#f97316"/><text x="1336" y="564" font-size="15" font-weight="600" fill="#17191c" text-anchor="end">36,0%</text><rect x="856" y="600" width="496" height="60" rx="8" fill="#f5f5f4"/><rect x="856" y="600" width="4" height="60" fill="#ca8a04"/><text x="876" y="626" font-size="13.5" font-weight="600" fill="#17191c" text-anchor="start">Tier 3 · Stilometri AI</text><text x="876" y="646" font-size="12" font-weight="400" fill="#6b7280" text-anchor="start">Bobot 15%</text><rect x="1060" y="627" width="190" height="6" rx="3" fill="#ededed"/><rect x="1060" y="627" width="35.15" height="6" rx="3" fill="#ca8a04"/><text x="1336" y="636" font-size="15" font-weight="600" fill="#17191c" text-anchor="end">18,5%</text><text x="856" y="700" font-size="11" font-weight="600" fill="#6b7280" text-anchor="start" letter-spacing="1.2">SINTESIS EDITORIAL AI</text><rect x="856" y="714" width="496" height="212" rx="8" fill="#fff" stroke="#ededed" stroke-width="1"/><text x="876" y="746" font-size="13.5" font-weight="400" fill="#404040" text-anchor="start">Skor komposit berada pada rentang waspada. Kemiripan</text><text x="876" y="770" font-size="13.5" font-weight="400" fill="#404040" text-anchor="start">tertinggi muncul pada paragraf pembuka Bab II yang</text><text x="876" y="794" font-size="13.5" font-weight="400" fill="#404040" text-anchor="start">menyalin hampir utuh definisi dari 2 sumber korpus.</text><text x="876" y="842" font-size="13.5" font-weight="400" fill="#404040" text-anchor="start">Parafrasa semantik ditemukan pada pembahasan efek</text><text x="876" y="866" font-size="13.5" font-weight="400" fill="#404040" text-anchor="start">suhu terhadap produktivitas lahan. Disarankan menambah</text><text x="876" y="890" font-size="13.5" font-weight="400" fill="#404040" text-anchor="start">sitasi langsung dan menulis ulang kalimat bertanda merah.</text>
