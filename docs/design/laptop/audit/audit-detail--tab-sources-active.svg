santara.ac.id</text><text x="48" y="142" font-size="13" font-weight="500" fill="#5B6475" text-anchor="start">Workspace Audit  /  Laporan Naskah  /  #AUD-2026-8812</text><text x="48" y="174" font-size="24" font-weight="600" fill="#0B0F19" text-anchor="start" letter-spacing="-0.4">Dampak Perubahan Iklim terhadap Ketahanan Pangan Lokal di Wilayah Pesisir</text><text x="48" y="200" font-size="13.5" font-weight="400" fill="#5B6475" text-anchor="start">Penulis: Rizky Pratama (NIM 11241045) · Institut Teknologi Nusantara · Diperiksa: 03 Nov 2026, 09.12 WIB</text><rect x="1100" y="150" width="164" height="48" rx="24" fill="url(#gDark)" filter="url(#sh-btn)" data-role="primary"/><text x="1182.0" y="179.04" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">Unduh PDF Resmi</text><rect x="1276" y="150" width="116" height="48" rx="24" fill="#F3F6FC"/><text x="1334" y="179" font-size="14" font-weight="500" fill="#B91C1C" text-anchor="middle">Hapus</text><line x1="48" y1="222" x2="1392" y2="222" stroke="#E4E8F0" stroke-width="1"/><rect x="48" y="240" width="780" height="720" rx="20" fill="#FFFFFF" fill-opacity="0.78" filter="url(#sh)"/><text x="76" y="282" font-size="18" font-weight="600" fill="#0B0F19" text-anchor="start">Naskah Asli &amp; Heatmap Deteksi</text><text x="76" y="304" font-size="13" font-weight="400" fill="#5B6475" text-anchor="start">Sorotan kalimat menunjukkan kecocokan dengan basis data referensi</text><text x="404" y="288" font-size="12.5" font-weight="600" fill="#5B6475" text-anchor="start">Filter:</text><rect x="448" y="268" width="92" height="34" rx="17" fill="#FEF3F2"/><circle cx="462" cy="285" r="4.5" fill="#B91C1C"/><text x="474" y="290" font-size="12.5" font-weight="600" fill="#B91C1C" text-anchor="start">Leksikal</text><rect x="548" y="268" width="102" height="34" rx="17" fill="#FFF1E6"/><circle cx="562" cy="285" r="4.5" fill="#C2410C"/><text x="574" y="290" font-size="12.5" font-weight="600" fill="#C2410C" text-anchor="start">Semantik</text><rect x="658" y="268" width="106" height="34" rx="17" fill="#FEF7D6"/><circle cx="672" cy="285" r="4.5" fill="#A16207"/><text x="684" y="290" font-size="12.5" font-weight="600" fill="#A16207" text-anchor="start">Stilometri</text><line x1="72" y1="320" x2="804" y2="320" stroke="#E4E8F0" stroke-width="1"/><text x="76" y="360" font-size="12" font-weight="600" fill="#636B7A" text-anchor="start">P01</text><text x="112" y="360" font-size="14.5" font-weight="400" fill="#0B0F19">Perubahan iklim global merupakan salah satu tantangan lingkungan paling mendesak di abad ke-21 yang memberikan dampak langsung pada stabilitas ekosistem pertanian.</text><text x="1225.1" y="360" font-size="14.5" font-weight="400" fill="#0B0F19">Peningkatan suhu permukaan laut serta pergeseran pola curah hujan musiman telah memicu penurunan produktivitas lahan basah secara signifikan di berbagai sentra pangan pesisir.</text><text x="112" y="388" font-size="14.5" font-weight="400" fill="#0B0F19">Fenomena kenaikan muka air laut yang terus berlangsung mempercepat laju intrusi air asin ke dalam akuifer air tawar.</text><text x="76" y="432" font-size="12" font-weight="600" fill="#636B7A" text-anchor="start">P02</text><text x="112" y="432" font-size="14.5" font-weight="400" fill="#0B0F19">Intrusi air laut mengakibatkan salinisasi tanah pertanian produktif yang menurunkan daya dukung lahan terhadap tanaman padi sawah.</text><text x="988.0" y="432" font-size="14.5" font-weight="400" fill="#0B0F19">Berdasarkan data empiris stasiun klimatologi lokal, frekuensi anomali cuaca ekstrem seperti banjir rob dan kekeringan berkepanjangan mengalami eskalasi frekuensi sebesar 34% dalam satu dekade terakhir.</text><text x="112" y="460" font-size="14.5" font-weight="400" fill="#0B0F19">Kondisi hidrometeorologis ini secara sistematis merusak infrastruktur irigasi primer dan sekunder yang menjadi urat nadi ketahanan pangan masyarakat pesisir.</text><text x="76" y="504" font-size="12" font-weight="600" fill="#636B7A" text-anchor="start">P03</text><text x="112" y="504" font-size="14.5" font-weight="400" fill="#0B0F19">Oleh karena itu, diperlukan perumusan strategi adaptasi berbasis kearifan lokal yang dipadukan dengan pemanfaatan varietas tanaman toleran salinitas tinggi.</text><text x="1144.2" y="504" font-size="14.5" font-weight="400" fill="#0B0F19">Pendekatan multisektoral yang melibatkan pemangku kebijakan, akademisi, dan kelompok tani lokal menjadi prasyarat mutlak demi menjamin keberlanjutan kedaulatan pangan.</text><text x="112" y="532" font-size="14.5" font-weight="400" fill="#0B0F19">Penguatan kapasitas kelembagaan desa dalam pengelolaan risiko bencana iklim harus diprioritaskan sebagai pilar ketahanan komunitas.</text><text x="76" y="576" font-size="12" font-weight="600" fill="#636B7A" text-anchor="start">P04</text><text x="112" y="576" font-size="14.5" font-weight="400" fill="#0B0F19">Penelitian ini bertujuan untuk memetakan kerentanan spasial lahan sawah terdampak intrusi serta merumuskan model mitigasi adaptif terpadu.</text><text x="1037.8" y="576" font-size="14.5" font-weight="400" fill="#0B0F19">Analisis risiko iklim dilakukan dengan menggabungkan proyeksi pemodelan sirkulasi atmosfer regional dengan data sosio-ekonomi rumah tangga petani.</text><rect x="848" y="240" width="544" height="720" rx="20" fill="#FFFFFF" fill-opacity="0.78" filter="url(#sh)"/><rect x="872" y="264" width="398.24" height="44" rx="22" fill="#F3F6FC"/><text x="929.28" y="291" font-size="14" font-weight="500" fill="#5B6475" text-anchor="middle">Ringkasan</text><rect x="982.56" y="268" width="114.4" height="36" rx="18" fill="#FFFFFF" filter="url(#sh-sm)"/><text x="1039.76" y="291" font-size="14" font-weight="600" fill="#0B0F19" text-anchor="middle">Sumber (4)</text><text x="1181.6000000000001" y="291" font-size="14" font-weight="500" fill="#5B6475" text-anchor="middle">Perbandingan Diff</text><line x1="872" y1="320" x2="1368" y2="320" stroke="#E4E8F0" stroke-width="1"/><text x="876" y="352" font-size="12" font-weight="600" fill="#5B6475" text-anchor="start" letter-spacing="1.0">DAFTAR SUMBER RUJUKAN TERDETEKSI</text><text x="1364" y="352" font-size="12.5" font-weight="400" fill="#5B6475" text-anchor="end">Total 4 dokumen</text><rect x="872" y="372" width="496" height="104" rx="14" fill="#F3F6FC"/><circle cx="894" cy="400" r="12" fill="#FFFFFF"/><text x="894" y="405" font-size="12" font-weight="600" fill="#0B0F19" text-anchor="middle">1</text><text x="916" y="402" font-size="14.5" font-weight="600" fill="#0B0F19" text-anchor="start">Jurnal Agronomi Pesisir Vol. 14</text><text x="916" y="422" font-size="12.5" font-weight="400" fill="#5B6475" text-anchor="start">Dr. Ir. Suhendra, M.Si. (IPB)</text><circle cx="920" cy="448" r="4" fill="#C2410C"/><text x="930" y="452" font-size="12" font-weight="500" fill="#5B6475" text-anchor="start">Tier 2 · Semantik</text><text x="1078" y="452" font-size="12" font-weight="400" fill="#5B6475" text-anchor="start">4 kalimat</text><text x="1262" y="452" font-size="15" font-weight="600" fill="#C2410C" text-anchor="end">24,8%</text><text x="1348" y="452" font-size="12.5" font-weight="600" fill="#1560BD" text-anchor="end">Bandingkan →</text><rect x="872" y="488" width="496" height="104" rx="14" fill="#F3F6FC"/><circle cx="894" cy="516" r="12" fill="#FFFFFF"/><text x="894" y="521" font-size="12" font-weight="600" fill="#0B0F19" text-anchor="middle">2</text><text x="916" y="518" font-size="14.5" font-weight="600" fill="#0B0F19" text-anchor="start">Prosiding Simposium Ketahanan Iklim 2024</text><text x="916" y="538" font-size="12.5" font-weight="400" fill="#5B6475" text-anchor="start">Budi Santoso dkk. (UGM)</text><circle cx="920" cy="564" r="4" fill="#B91C1C"/><text x="930" y="568" font-size="12" font-weight="500" fill="#5B6475" text-anchor="start">Tier 1 · Leksikal</text><text x="1078" y="568" font-size="12" font-weight="400" fill="#5B6475" text-anchor="start">3 kalimat</text><text x="1262" y="568" font-size="15" font-weight="600" fill="#B91C1C" text-anchor="end">18,2%</text><text x="1348" y="568" font-size="12.5" font-weight="600" fill="#1560BD" text-anchor="end">Bandingkan →</text><rect x="872" y="604" width="496" height="104" rx="14" fill="#F3F6FC"/><circle cx="894" cy="632" r="12" fill="#FFFFFF"/><text x="894" y="637" font-size="12" font-weight="600" fill="#0B0F19" text-anchor="middle">3</text><text x="916" y="634" font-size="14.5" font-weight="600" fill="#0B0F19" text-anchor="start">Model Hidrometeorologi Estuari Jawa</text><text x="916" y="654" font-size="12.5" font-weight="400" fill="#5B6475" text-anchor="start">Puslitbang Sumber Daya Air</text><circle cx="920" cy="680" r="4" fill="#C2410C"/><text x="930" y="684" font-size="12" font-weight="500" fill="#5B6475" text-anchor="start">Tier 2 · Semantik</text><text x="1078" y="684" font-size="12" font-weight="400" fill="#5B6475" text-anchor="start">2 kalimat</text><text x="1262" y="684" font-size="15" font-weight="600" fill="#C2410C" text-anchor="end">11,5%</text><text x="1348" y="684" font-size="12.5" font-weight="600" fill="#1560BD" text-anchor="end">Bandingkan →</text><rect x="872" y="720" width="496" height="104" rx="14" fill="#F3F6FC"/><circle cx="894" cy="748" r="12" fill="#FFFFFF"/><text x="894" y="753" font-size="12" font-weight="600" fill="#0B0F19" text-anchor="middle">4</text><text x="916" y="750" font-size="14.5" font-weight="600" fill="#0B0F19" text-anchor="start">Sintesis Literatur Perubahan Iklim AI</text><text x="916" y="770" font-size="12.5" font-weight="400" fill="#5B6475" text-anchor="start">Model Generator GPT-4</text><circle cx="920" cy="796" r="4" fill="#A16207"/><text x="930" y="800" font-size="12" font-weight="500" fill="#5B6475" text-anchor="start">Tier 3 · Stilometri</text><text x="1078" y="800" font-size="12" font-weight="400" fill="#5B6475" text-anchor="start">1 kalimat</text><text x="1262" y="800" font-size="15" font-weight="600" fill="#A16207" text-anchor="end">8,4%</text><text x="1348" y="800" font-size="12.5" font-weight="600" fill="#1560BD" text-anchor="end">Bandingkan →</text>
