<linearGradient id="gGlow" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#EAF3FE"/><stop offset="1" stop-color="#3B5BDB" stop-opacity="0.28"/></linearGradient>
<linearGradient id="gBg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E8F0FF"/><stop offset="0.55" stop-color="#DDF4FF"/><stop offset="1" stop-color="#EDE7FF"/></linearGradient>
