<linearGradient id="gFilter" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1A73D9"/><stop offset="1" stop-color="#3B5BDB"/></linearGradient>
<linearGradient id="gDark" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B0F19"/><stop offset="1" stop-color="#3A3A40"/></linearGradient>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="2"/></pattern>
<filter id="sh-hero" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#1A73D9" flood-opacity="0.28"/></filter>
</defs>
<rect x="0" y="0" width="1440" height="1020" fill="url(#gBg)"/><g filter="url(#orb)"><circle cx="1240" cy="220" r="250" fill="#3B82F6" fill-opacity="0.32"/><circle cx="180" cy="760" r="270" fill="#22D3EE" fill-opacity="0.3"/><circle cx="1180" cy="1180" r="250" fill="#A78BFA" fill-opacity="0.3"/></g>
<rect x="48" y="24" width="1344" height="68" rx="34" fill="#FFFFFF" fill-opacity="0.78" filter="url(#sh)"/><text x="80" y="65" font-size="21" font-weight="700" fill="#0B0F19">VeriText AI<tspan fill="#1A73D9">.</tspan></text><rect x="516.25" y="32" width="407.5" height="52" rx="26" fill="#F3F6FC"/><text x="562.875" y="63" font-size="15" font-weight="500" fill="#0B0F19" text-anchor="middle">Fitur</text><text x="652.5" y="63" font-size="15" font-weight="500" fill="#0B0F19" text-anchor="middle">Pipeline</text><text x="750.375" y="63" font-size="15" font-weight="500" fill="#0B0F19" text-anchor="middle">Koleksi</text><rect x="797.25" y="38" width="118.5" height="40" rx="20" fill="#0B0F19"/><text x="856.5" y="63" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="middle">Verifikasi</text><text x="1176" y="63" font-size="15" font-weight="500" fill="#0B0F19" text-anchor="start">Masuk</text><rect x="1240" y="36" width="120" height="44" rx="22" fill="#F3F6FC" data-role="secondary"/><text x="1300.0" y="63.22" font-size="14.5" font-weight="600" fill="#0B0F19" text-anchor="middle">Daftar</text><text x="48" y="126" font-size="12" font-weight="600" fill="#5B6475" text-anchor="start">Portal Integritas Publik  /  Verifikasi Sertifikat</text><text x="48" y="154" font-size="24" font-weight="600" fill="#0B0F19" text-anchor="start" letter-spacing="-0.4">Verifikasi Keaslian Sertifikat &amp; Naskah Ilmiah</text><text x="48" y="178" font-size="13.5" font-weight="400" fill="#5B6475" text-anchor="start">Pemeriksaan keaslian sertifikat audit naskah akademik berbasis tanda tangan digital SHA-256.</text><rect x="48" y="202" width="1020" height="56" rx="14" fill="#F3F6FC"/><text x="64" y="223" font-size="12" font-weight="500" fill="#5B6475" text-anchor="start">Nomor UUID Sertifikat (36 karakter, contoh: 8f2a91c4-b7e1-4d90-a35c-7e6189df0123)</text><text x="64" y="244" font-size="15" font-weight="500" fill="#0B0F19" text-anchor="start">8f2a91c4-b7e1-4d90-a35c-7e6189df0123</text><rect x="1084" y="202" width="308" height="48" rx="24" fill="#F3F6FC" data-role="secondary"/><text x="1238.0" y="231.04" font-size="14" font-weight="600" fill="#0B0F19" text-anchor="middle">Verifikasi Sertifikat →</text><text x="48" y="272" font-size="12.5" font-weight="400" fill="#5B6475" text-anchor="start">Format UUID 36-karakter tertera pada footer sertifikat audit naskah VeriText AI.</text><text x="1392" y="272" font-size="12.5" font-weight="600" fill="#1560BD" text-anchor="end">📷 Beralih ke Pemindai QR Dokumen Fisik →</text><rect x="48" y="296" width="14" height="14" rx="4" fill="#F3F6FC"/><text x="72" y="307.5" font-size="13.5" font-weight="600" fill="#0B0F19" text-anchor="start">Pengecekan Integritas Kriptografis</text><text x="352.21999999999997" y="307.5" font-size="12.5" font-weight="400" fill="#5B6475" text-anchor="start">Mencocokkan Rekaman Ledger</text><text x="1248.89" y="307.5" font-size="12.5" font-weight="500" fill="#5B6475" text-anchor="end">Status</text><text x="1392" y="307.5" font-size="13.5" font-weight="600" fill="#5B6475" text-anchor="end">Sedang Memproses…</text><rect x="270" y="330" width="900" height="580" rx="20" fill="#FFFFFF" fill-opacity="0.78" filter="url(#sh)"/><rect x="294" y="354" width="14" height="14" rx="4" fill="#F3F6FC"/><text x="318" y="365.5" font-size="12.5" font-weight="600" fill="#0B0F19" text-anchor="start">PIPELINE VALIDASI</text><rect x="451.25" y="352" width="64.72" height="20" rx="10" fill="#F3F6FC"/><text x="483.61" y="366" font-size="12" font-weight="500" fill="#5B6475" text-anchor="middle">4 Tahap</text><text x="525.97" y="365.5" font-size="12" font-weight="400" fill="#5B6475" text-anchor="start">Konsensus PTN</text><text x="1118" y="365.5" font-size="13" font-weight="600" fill="#5B6475" text-anchor="end">···</text><text x="1146" y="365.5" font-size="14" font-weight="500" fill="#5B6475" text-anchor="end">···</text><path d="M720 396A20 20 0 1 1 700 416" fill="none" stroke="#1A73D9" stroke-width="3.0" stroke-linecap="round"/><text x="720" y="466" font-size="19" font-weight="600" fill="#0B0F19" text-anchor="middle">Memvalidasi Tanda Tangan Digital Naskah…</text><text x="720" y="490" font-size="13.5" font-weight="400" fill="#5B6475" text-anchor="middle">Mencocokkan nilai checksum SHA-256 pada pangkalan data ledger terdistribusi.</text><line x1="310" y1="524" x2="1130" y2="524" stroke="#E4E8F0" stroke-width="1"/><text x="310" y="562" font-size="14" font-weight="600" fill="#15803D" text-anchor="start">✓</text><text x="336" y="562" font-size="13.5" font-weight="600" fill="#0B0F19" text-anchor="start">Tahap 1: Pencarian Nomor UUID pada Indeks Ledger</text><text x="1130" y="562" font-size="12.5" font-weight="600" fill="#15803D" text-anchor="end">Selesai (142 ms)</text><line x1="310" y1="576" x2="1130" y2="576" stroke="#E4E8F0" stroke-width="1"/><text x="310" y="608" font-size="14" font-weight="600" fill="#1560BD" text-anchor="start">⟳</text><text x="336" y="608" font-size="13.5" font-weight="600" fill="#1560BD" text-anchor="start">Tahap 2: Perhitungan Checksum SHA-256 Dokumen</text><text x="1130" y="608" font-size="12.5" font-weight="600" fill="#1560BD" text-anchor="end">Sedang memproses…</text><line x1="310" y1="622" x2="1130" y2="622" stroke="#E4E8F0" stroke-width="1"/><text x="310" y="654" font-size="14" font-weight="400" fill="#636B7A" text-anchor="start">○</text><text x="336" y="654" font-size="13.5" font-weight="400" fill="#5B6475" text-anchor="start">Tahap 3: Verifikasi Tanda Tangan Digital Kunci Ed25519</text><text x="1130" y="654" font-size="12.5" font-weight="400" fill="#636B7A" text-anchor="end">Menunggu giliran</text><line x1="310" y1="668" x2="1130" y2="668" stroke="#E4E8F0" stroke-width="1"/><text x="310" y="700" font-size="14" font-weight="400" fill="#636B7A" text-anchor="start">○</text><text x="336" y="700" font-size="13.5" font-weight="400" fill="#5B6475" text-anchor="start">Tahap 4: Rekonsiliasi Korpus &amp; Rekaman Konsensus</text><text x="1130" y="700" font-size="12.5" font-weight="400" fill="#636B7A" text-anchor="end">Menunggu giliran</text><line x1="310" y1="714" x2="1130" y2="714" stroke="#E4E8F0" stroke-width="1"/><text x="310" y="754" font-size="12.5" font-weight="500" fill="#5B6475" text-anchor="start">Kemajuan Verifikasi Kriptografis:</text><text x="1130" y="754" font-size="12.5" font-weight="600" fill="#1560BD" text-anchor="end">48%</text><rect x="310" y="766" width="820" height="6" rx="3" fill="#DCE3F0"/><rect x="310" y="766" width="393.6" height="6" rx="3" fill="#1A73D9"/><text x="310" y="840" font-size="12.5" font-weight="400" fill="#5B6475" text-anchor="start">Pemberitahuan Privasi: Seluruh komputasi dilakukan secara terenkripsi tanpa menyimpan isi naskah Anda.</text><rect x="310" y="864" width="159.2" height="24" rx="12" fill="#F3F6FC"/><text x="389.6" y="880" font-size="12" font-weight="500" fill="#5B6475" text-anchor="middle">SHA-256 Kriptografis</text><rect x="477.2" y="864" width="96.55999999999999" height="24" rx="12" fill="#F3F6FC"/><text x="525.48" y="880" font-size="12" font-weight="500" fill="#5B6475" text-anchor="middle">Ed25519 W3C</text><rect x="581.76" y="864" width="117.44" height="24" rx="12" fill="#F3F6FC"/><text x="640.48" y="880" font-size="12" font-weight="500" fill="#5B6475" text-anchor="middle">Zero-Knowledge</text>
</svg>
