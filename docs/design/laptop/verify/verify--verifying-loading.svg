<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1020" viewBox="0 0 1440 1020" role="img" aria-labelledby="t d">
<title id="t">Memvalidasi Sertifikat - VeriText AI</title>
<desc id="d">Indikator tahapan loading saat server memverifikasi hash SHA-256 dokumen.</desc>
<defs>
