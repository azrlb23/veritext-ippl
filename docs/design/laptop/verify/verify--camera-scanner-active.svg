<rect x="48" y="24" width="1344" height="68" rx="34" fill="#FFFFFF" fill-opacity="0.78" filter="url(#sh)"/><text x="80" y="65" font-size="21" font-weight="700" fill="#0B0F19">VeriText AI<tspan fill="#1A73D9">.</tspan></text><rect x="516.25" y="32" width="407.5" height="52" rx="26" fill="#F3F6FC"/><text x="562.875" y="63" font-size="15" font-weight="500" fill="#0B0F19" text-anchor="middle">Fitur</text><text x="652.5" y="63" font-size="15" font-weight="500" fill="#0B0F19" text-anchor="middle">Pipeline</text><text x="750.375" y="63" font-size="15" font-weight="500" fill="#0B0F19" text-anchor="middle">Koleksi</text><rect x="797.25" y="38" width="118.5" height="40" rx="20" fill="#0B0F19"/><text x="856.5" y="63" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="middle">Verifikasi</text><text x="1176" y="63" font-size="15" font-weight="500" fill="#0B0F19" text-anchor="start">Masuk</text><rect x="1240" y="36" width="120" height="44" rx="22" fill="#F3F6FC" data-role="secondary"/><text x="1300.0" y="63.22" font-size="14.5" font-weight="600" fill="#0B0F19" text-anchor="middle">Daftar</text><text x="48" y="126" font-size="12" font-weight="600" fill="#5B6475" text-anchor="start">Portal Integritas Publik  /  Verifikasi Sertifikat</text><text x="48" y="154" font-size="24" font-weight="600" fill="#0B0F19" text-anchor="start" letter-spacing="-0.4">Verifikasi Keaslian Sertifikat &amp; Naskah Ilmiah</text><text x="48" y="178" font-size="13.5" font-weight="400" fill="#5B6475" text-anchor="start">Pemeriksaan keaslian sertifikat audit naskah akademik berbasis tanda tangan digital SHA-256.</text><rect x="48" y="202" width="1020" height="48" rx="14" fill="#F3F6FC"/><circle cx="74" cy="226" r="5" fill="#15803D"/><text x="92" y="231" font-size="13.5" font-weight="500" fill="#0B0F19" text-anchor="start">Mode Pemindai Kamera Aktif · Mengarahkan ke Barcode Dokumen Fisik</text><rect x="1084" y="202" width="308" height="48" rx="24" fill="#F3F6FC" data-role="secondary"/><text x="1238.0" y="231.04" font-size="14" font-weight="600" fill="#0B0F19" text-anchor="middle">Beralih ke Input Manual</text><text x="48" y="272" font-size="12.5" font-weight="400" fill="#5B6475" text-anchor="start">Arahkan kamera ke kode QR fisik atau klik tombol di samping untuk mengetik kode.</text><rect x="48" y="296" width="14" height="14" rx="4" fill="#F3F6FC"/><text x="72" y="307.5" font-size="13.5" font-weight="600" fill="#0B0F19" text-anchor="start">Mode Pemindai Optik Kamera Aktif</text><text x="336.55999999999995" y="307.5" font-size="12.5" font-weight="400" fill="#5B6475" text-anchor="start">Webcam 1080p @ 60 FPS</text><text x="1264.55" y="307.5" font-size="12.5" font-weight="500" fill="#5B6475" text-anchor="end">Status Sensor</text><text x="1392" y="307.5" font-size="13.5" font-weight="600" fill="#5B6475" text-anchor="end">Mengunci Fokus…</text><rect x="48" y="330" width="880" height="630" rx="20" fill="#FFFFFF" fill-opacity="0.78" filter="url(#sh)"/><rect x="68" y="350" width="840" height="550" rx="14" fill="#0B0F19"/><circle cx="92" cy="378" r="5" fill="#B91C1C"/><text x="106" y="382.5" font-size="12" font-weight="500" fill="#636B7A" text-anchor="start">WEBCAM LIVE STREAM (1080p @ 60 FPS) · ISO-18004 DECODER</text><line x1="68" y1="398" x2="908" y2="398" stroke="#E4E8F0" stroke-width="1"/><line x1="358" y1="495" x2="386" y2="495" stroke="#E4E8F0" stroke-width="1"/><line x1="358" y1="495" x2="358" y2="523" stroke="#E4E8F0" stroke-width="1"/><line x1="618" y1="495" x2="590" y2="495" stroke="#E4E8F0" stroke-width="1"/><line x1="618" y1="495" x2="618" y2="523" stroke="#E4E8F0" stroke-width="1"/><line x1="358" y1="755" x2="386" y2="755" stroke="#E4E8F0" stroke-width="1"/><line x1="358" y1="755" x2="358" y2="727" stroke="#E4E8F0" stroke-width="1"/><line x1="618" y1="755" x2="590" y2="755" stroke="#E4E8F0" stroke-width="1"/><line x1="618" y1="755" x2="618" y2="727" stroke="#E4E8F0" stroke-width="1"/><line x1="472" y1="625" x2="504" y2="625" stroke="#E4E8F0" stroke-width="1"/><line x1="488" y1="609" x2="488" y2="641" stroke="#E4E8F0" stroke-width="1"/><line x1="372" y1="605" x2="604" y2="605" stroke="#E4E8F0" stroke-width="1"/><text x="488" y="870" font-size="13" font-weight="500" fill="#636B7A" text-anchor="middle">Arahkan QR Code cetak pada dokumen fisik ke dalam area bingkai target</text><text x="72" y="934" font-size="12.5" font-weight="400" fill="#5B6475" text-anchor="start">Sensor optik otomatis membaca kode begitu posisi barcode stabil.</text><text x="904" y="934" font-size="12.5" font-weight="600" fill="#1560BD" text-anchor="end">Beralih ke Input 36-Digit Manual →</text><rect x="952" y="330" width="440" height="630" rx="20" fill="#FFFFFF" fill-opacity="0.78" filter="url(#sh)"/><rect x="976" y="354" width="14" height="14" rx="4" fill="#F3F6FC"/><text x="1000" y="365.5" font-size="12.5" font-weight="600" fill="#0B0F19" text-anchor="start">SENSOR OPTIK</text><rect x="1097.0" y="352" width="78.63999999999999" height="20" rx="10" fill="#F3F6FC"/><text x="1136.32" y="366" font-size="12" font-weight="500" fill="#5B6475" text-anchor="middle">Real-Time</text><text x="1185.6399999999999" y="365.5" font-size="12" font-weight="400" fill="#5B6475" text-anchor="start">Fokus Otomatis</text><text x="1340" y="365.5" font-size="13" font-weight="600" fill="#5B6475" text-anchor="end">···</text><text x="1368" y="365.5" font-size="14" font-weight="500" fill="#5B6475" text-anchor="end">···</text><text x="976" y="402" font-size="17" font-weight="600" fill="#0B0F19" text-anchor="start">Panduan Pemindaian Cepat</text><text x="976" y="426" font-size="13" font-weight="400" fill="#5B6475" text-anchor="start">Pemeriksaan otomatis bekerja dalam hitungan milidetik begitu QR Code terfokus.</text><line x1="976" y1="458" x2="1368" y2="458" stroke="#E4E8F0" stroke-width="1"/><text x="976" y="492" font-size="12.5" font-weight="400" fill="#5B6475" text-anchor="start">Jarak Sensor Ideal</text><text x="1368" y="492" font-size="12.5" font-weight="600" fill="#0B0F19" text-anchor="end">20 – 30 cm dari dokumen</text><line x1="976" y1="506" x2="1368" y2="506" stroke="#E4E8F0" stroke-width="1"/><text x="976" y="536" font-size="12.5" font-weight="400" fill="#5B6475" text-anchor="start">Pencahayaan Ruang</text><text x="1368" y="536" font-size="12.5" font-weight="600" fill="#0B0F19" text-anchor="end">Optimal (Hindari pantulan silau)</text><line x1="976" y1="550" x2="1368" y2="550" stroke="#E4E8F0" stroke-width="1"/><text x="976" y="580" font-size="12.5" font-weight="400" fill="#5B6475" text-anchor="start">Kecepatan Deteksi</text><text x="1368" y="580" font-size="12.5" font-weight="600" fill="#0B0F19" text-anchor="end">&lt; 200 ms saat fokus terkunci</text><line x1="976" y1="594" x2="1368" y2="594" stroke="#E4E8F0" stroke-width="1"/><text x="976" y="624" font-size="12.5" font-weight="400" fill="#5B6475" text-anchor="start">Format Kode</text><text x="1368" y="624" font-size="12.5" font-weight="600" fill="#0B0F19" text-anchor="end">QR-Code ISO/IEC 18004</text><line x1="976" y1="638" x2="1368" y2="638" stroke="#E4E8F0" stroke-width="1"/><text x="976" y="680" font-size="12" font-weight="600" fill="#5B6475" text-anchor="start">STATUS KALIBRASI SENSOR:</text><text x="976" y="706" font-size="12.5" font-weight="400" fill="#5B6475" text-anchor="start">•  Kecerahan Ruang: 88% (Sangat Baik)</text><text x="976" y="730" font-size="12.5" font-weight="400" fill="#5B6475" text-anchor="start">•  Kontras Tepi: 94/100 (Optimal)</text><text x="976" y="754" font-size="12.5" font-weight="400" fill="#5B6475" text-anchor="start">•  Orientasi Bidik: Sejajar / Tegak Lurus</text><line x1="976" y1="800" x2="1368" y2="800" stroke="#E4E8F0" stroke-width="1"/><rect x="976" y="820" width="89.6" height="24" rx="12" fill="#F3F6FC"/><text x="1020.8" y="836" font-size="12" font-weight="500" fill="#5B6475" text-anchor="middle">Auto-Focus</text><rect x="1073.6" y="820" width="110.47999999999999" height="24" rx="12" fill="#F3F6FC"/><text x="1128.84" y="836" font-size="12" font-weight="500" fill="#5B6475" text-anchor="middle">High-Contrast</text><rect x="1192.08" y="820" width="61.76" height="24" rx="12" fill="#F3F6FC"/><text x="1222.96" y="836" font-size="12" font-weight="500" fill="#5B6475" text-anchor="middle">60 FPS</text><rect x="976" y="876" width="392" height="48" rx="24" fill="#F3F6FC" data-role="secondary"/><text x="1172.0" y="904.86" font-size="13.5" font-weight="600" fill="#0B0F19" text-anchor="middle">Beralih ke Input Kode UUID Manual</text>
