<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1020" viewBox="0 0 1440 1020" role="img" aria-labelledby="t d">
<title id="t">Sertifikat Tidak Ditemukan - VeriText AI</title>
<desc id="d">Peringatan saat kode UUID sertifikat tidak terdaftar atau tidak valid.</desc>
<defs>
<style>@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;display=swap');text{font-family:'Outfit','Gilroy','Poppins','Helvetica Neue',Arial,sans-serif}</style>
<filter id="sh" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#8A98B8" flood-opacity="0.14"/></filter>
<filter id="sh-sm" x="-10%" y="-20%" width="120%" height="160%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#8A98B8" flood-opacity="0.25"/></filter>
<filter id="glow" x="-20%" y="-30%" width="140%" height="210%"><feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#1A73D9" flood-opacity="0.35"/></filter>
<filter id="sh-btn" x="-20%" y="-40%" width="140%" height="220%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0B0F19" flood-opacity="0.26"/></filter>
<linearGradient id="gGlow" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#EAF3FE"/><stop offset="1" stop-color="#3B5BDB" stop-opacity="0.28"/></linearGradient>
<linearGradient id="gBg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E8F0FF"/><stop offset="0.55" stop-color="#DDF4FF"/><stop offset="1" stop-color="#EDE7FF"/></linearGradient>
<filter id="orb" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="70"/></filter>
<linearGradient id="gHero" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1A73D9"/><stop offset="1" stop-color="#3B5BDB"/></linearGradient>
<linearGradient id="gFilter" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1A73D9"/><stop offset="1" stop-color="#3B5BDB"/></linearGradient>
<linearGradient id="gDark" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B0F19"/><stop offset="1" stop-color="#3A3A40"/></linearGradient>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="2"/></pattern>
<filter id="sh-hero" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#1A73D9" flood-opacity="0.28"/></filter>
</defs>
<rect x="0" y="0" width="1440" height="1020" fill="url(#gBg)"/><g filter="url(#orb)"><circle cx="1240" cy="220" r="250" fill="#3B82F6" fill-opacity="0.32"/><circle cx="180" cy="760" r="270" fill="#22D3EE" fill-opacity="0.3"/><circle cx="1180" cy="1180" r="250" fill="#A78BFA" fill-opacity="0.3"/></g>
<rect x="48" y="24" width="1344" height="68" rx="34" fill="#FFFFFF" fill-opacity="0.78" filter="url(#sh)"/><text x="80" y="65" font-size="21" font-weight="700" fill="#0B0F19">VeriText AI<tspan fill="#1A73D9">.</tspan></text><rect x="516.25" y="32" width="407.5" height="52" rx="26" fill="#F3F6FC"/><text x="562.875" y="63" font-size="15" font-weight="500" fill="#0B0F19" text-anchor="middle">Fitur</text><text x="652.5" y="63" font-size="15" font-weight="500" fill="#0B0F19" text-anchor="middle">Pipeline</text><text x="750.375" y="63" font-size="15" font-weight="500" fill="#0B0F19" text-anchor="middle">Koleksi</text><rect x="797.25" y="38" width="118.5" height="40" rx="20" fill="#0B0F19"/><text x="856.5" y="63" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="middle">Verifikasi</text><text x="1176" y="63" font-size="15" font-weight="500" fill="#0B0F19" text-anchor="start">Masuk</text><rect x="1240" y="36" width="120" height="44" rx="22" fill="#F3F6FC" data-role="secondary"/><text x="1300.0" y="63.22" font-size="14.5" font-weight="600" fill="#0B0F19" text-anchor="middle">Daftar</text><text x="48" y="126" font-size="12" font-weight="600" fill="#5B6475" text-anchor="start">Portal Integritas Publik  /  Verifikasi Sertifikat</text><text x="48" y="154" font-size="24" font-weight="600" fill="#0B0F19" text-anchor="start" letter-spacing="-0.4">Verifikasi Keaslian Sertifikat &amp; Naskah Ilmiah</text><text x="48" y="178" font-size="13.5" font-weight="400" fill="#5B6475" text-anchor="start">Pemeriksaan keaslian sertifikat audit naskah akademik berbasis tanda tangan digital SHA-256.</text><rect x="48" y="202" width="1020" height="56" rx="14" fill="#F3F6FC"/><rect x="64" y="253" width="988" height="3" rx="1.5" fill="#B91C1C" data-role="state-bar"/><text x="64" y="223" font-size="12" font-weight="500" fill="#B91C1C" text-anchor="start">Nomor UUID Sertifikat (36 karakter, contoh: 8f2a91c4-b7e1-4d90-a35c-7e6189df0123)</text><text x="64" y="244" font-size="15" font-weight="500" fill="#0B0F19" text-anchor="start">99999999-0000-4000-8000-000000000000</text><rect x="1084" y="202" width="308" height="48" rx="24" fill="#F3F6FC" data-role="secondary"/><text x="1238.0" y="231.04" font-size="14" font-weight="600" fill="#0B0F19" text-anchor="middle">Verifikasi Sertifikat →</text><text x="48" y="272" font-size="12.5" font-weight="400" fill="#5B6475" text-anchor="start">Format UUID 36-karakter tertera pada footer sertifikat audit naskah VeriText AI.</text><text x="1392" y="272" font-size="12.5" font-weight="600" fill="#1560BD" text-anchor="end">📷 Beralih ke Pemindai QR Dokumen Fisik →</text><rect x="48" y="296" width="14" height="14" rx="4" fill="#F3F6FC"/><text x="72" y="307.5" font-size="13.5" font-weight="600" fill="#0B0F19" text-anchor="start">Hasil Penelusuran Identifikasi Sertifikat</text><text x="407.03" y="307.5" font-size="12.5" font-weight="400" fill="#5B6475" text-anchor="start">Query: 99999999-0000-4000-8000-000000000000</text><text x="1217.57" y="307.5" font-size="12.5" font-weight="500" fill="#5B6475" text-anchor="end">Status Catatan</text><text x="1392" y="307.5" font-size="13.5" font-weight="600" fill="#B91C1C" text-anchor="end">Tidak Terdaftar (404)</text><rect x="48" y="330" width="880" height="630" rx="20" fill="#FFFFFF" fill-opacity="0.78" filter="url(#sh)"/><rect x="72" y="354" width="14" height="14" rx="4" fill="#F3F6FC"/><text x="96" y="365.5" font-size="12.5" font-weight="600" fill="#0B0F19" text-anchor="start">STATUS PENCARIAN</text><rect x="222.0" y="352" width="106.47999999999999" height="20" rx="10" fill="#F3F6FC"/><text x="275.24" y="366" font-size="12" font-weight="500" fill="#5B6475" text-anchor="middle">404 Not Found</text><text x="338.48" y="365.5" font-size="12" font-weight="400" fill="#5B6475" text-anchor="start">Pemeriksaan Ledger</text><text x="876" y="365.5" font-size="13" font-weight="600" fill="#5B6475" text-anchor="end">···</text><text x="904" y="365.5" font-size="14" font-weight="500" fill="#5B6475" text-anchor="end">···</text><text x="72" y="402" font-size="18" font-weight="600" fill="#B91C1C" text-anchor="start">Kode Sertifikat Tidak Ditemukan</text><text x="72" y="426" font-size="13.5" font-weight="400" fill="#5B6475" text-anchor="start">Nomor UUID 99999999-0000-4000-8000-000000000000 tidak tercatat dalam pangkalan data integritas resmi VeriText AI.</text><line x1="72" y1="458" x2="904" y2="458" stroke="#E4E8F0" stroke-width="1"/><text x="72" y="484" font-size="13.5" font-weight="600" fill="#0B0F19" text-anchor="start">Hasil Penelusuran Sistem</text><text x="72" y="506" font-size="12.5" font-weight="400" fill="#5B6475" text-anchor="start">0 kecocokan dari 1.420.850 rekaman ledger konsorsium perguruan tinggi.</text><line x1="72" y1="528" x2="904" y2="528" stroke="#E4E8F0" stroke-width="1"/><text x="72" y="556" font-size="13.5" font-weight="600" fill="#0B0F19" text-anchor="start">1. Periksa Kembali Format Kode UUID</text><text x="72" y="578" font-size="12.5" font-weight="400" fill="#5B6475" text-anchor="start">Pastikan format kode adalah 8-4-4-4-12 karakter alfanumerik lengkap dengan 4 tanda strip (-).</text><line x1="72" y1="600" x2="904" y2="600" stroke="#E4E8F0" stroke-width="1"/><text x="72" y="628" font-size="13.5" font-weight="600" fill="#0B0F19" text-anchor="start">2. Periksa Status Penyelesaian Uji</text><text x="72" y="650" font-size="12.5" font-weight="400" fill="#5B6475" text-anchor="start">Naskah yang masih berada dalam antrean pemrosesan belum memiliki sertifikat resmi hingga audit selesai.</text><line x1="72" y1="672" x2="904" y2="672" stroke="#E4E8F0" stroke-width="1"/><text x="72" y="700" font-size="13.5" font-weight="600" fill="#0B0F19" text-anchor="start">3. Verifikasi Institusi Penerbit</text><text x="72" y="722" font-size="12.5" font-weight="400" fill="#5B6475" text-anchor="start">Pastikan perguruan tinggi atau institusi penguji telah terdaftar dalam kemitraan resmi VeriText AI.</text><line x1="72" y1="744" x2="904" y2="744" stroke="#E4E8F0" stroke-width="1"/><rect x="72" y="876" width="260" height="48" rx="24" fill="#F3F6FC" data-role="secondary"/><text x="202.0" y="905.04" font-size="14" font-weight="600" fill="#0B0F19" text-anchor="middle">Coba Periksa Kode Lain</text><rect x="358" y="888" width="145.27999999999997" height="24" rx="12" fill="#F3F6FC"/><text x="430.64" y="904" font-size="12" font-weight="500" fill="#5B6475" text-anchor="middle">Bantuan Verifikasi</text><rect x="511.28" y="888" width="110.47999999999999" height="24" rx="12" fill="#F3F6FC"/><text x="566.52" y="904" font-size="12" font-weight="500" fill="#5B6475" text-anchor="middle">Pusat Layanan</text><rect x="952" y="330" width="440" height="630" rx="20" fill="#FFFFFF" fill-opacity="0.78" filter="url(#sh)"/><rect x="976" y="354" width="14" height="14" rx="4" fill="#F3F6FC"/><text x="1000" y="365.5" font-size="12.5" font-weight="600" fill="#0B0F19" text-anchor="start">KEAMANAN</text><rect x="1068.0" y="352" width="120.39999999999999" height="20" rx="10" fill="#F3F6FC"/><text x="1128.2" y="366" font-size="12" font-weight="500" fill="#5B6475" text-anchor="middle">Cegah Pemalsuan</text><text x="1198.4" y="365.5" font-size="12" font-weight="400" fill="#5B6475" text-anchor="start">Edukasi</text><text x="1340" y="365.5" font-size="13" font-weight="600" fill="#5B6475" text-anchor="end">···</text><text x="1368" y="365.5" font-size="14" font-weight="500" fill="#5B6475" text-anchor="end">···</text><text x="976" y="402" font-size="17" font-weight="600" fill="#0B0F19" text-anchor="start">Pencegahan Pemalsuan Dokumen</text><text x="976" y="426" font-size="13" font-weight="400" fill="#5B6475" text-anchor="start">Sertifikat resmi selalu memiliki tanda tangan digital yang tersinkronisasi dengan ledger institusi.</text><line x1="976" y1="458" x2="1368" y2="458" stroke="#E4E8F0" stroke-width="1"/><text x="976" y="484" font-size="13.5" font-weight="600" fill="#0B0F19" text-anchor="start">Stempel Verifikasi Dinamis</text><text x="976" y="506" font-size="12" font-weight="400" fill="#5B6475" text-anchor="start">QR Code asli selalu merujuk ke domain resmi institusi terverifikasi.</text><line x1="976" y1="528" x2="1368" y2="528" stroke="#E4E8F0" stroke-width="1"/><text x="976" y="556" font-size="13.5" font-weight="600" fill="#0B0F19" text-anchor="start">Kunci SHA-256 Otentik</text><text x="976" y="578" font-size="12" font-weight="400" fill="#5B6475" text-anchor="start">Terdapat 64 digit heksadesimal checksum dokumen yang unik.</text><line x1="976" y1="600" x2="1368" y2="600" stroke="#E4E8F0" stroke-width="1"/><text x="976" y="628" font-size="13.5" font-weight="600" fill="#0B0F19" text-anchor="start">Tanda Tangan Digital Terbuka</text><text x="976" y="650" font-size="12" font-weight="400" fill="#5B6475" text-anchor="start">Diverifikasi langsung oleh konsorsium validator node perguruan tinggi.</text><line x1="976" y1="672" x2="1368" y2="672" stroke="#E4E8F0" stroke-width="1"/><text x="976" y="742" font-size="13" font-weight="600" fill="#0B0F19" text-anchor="start">Menemukan indikasi manipulasi atau pemalsuan?</text><text x="976" y="764" font-size="12.5" font-weight="400" fill="#5B6475" text-anchor="start">Laporkan ke Satuan Pengawas Internal kampus untuk investigasi etik.</text><rect x="976" y="810" width="392" height="48" rx="24" fill="url(#gDark)" filter="url(#sh-btn)" data-role="primary"/><text x="1172.0" y="839.04" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">Laporkan Dugaan Pemalsuan →</text><rect x="976" y="888" width="110.47999999999999" height="24" rx="12" fill="#F3F6FC"/><text x="1031.24" y="904" font-size="12" font-weight="500" fill="#5B6475" text-anchor="middle">Pelaporan SPI</text><rect x="1094.48" y="888" width="110.47999999999999" height="24" rx="12" fill="#F3F6FC"/><text x="1149.72" y="904" font-size="12" font-weight="500" fill="#5B6475" text-anchor="middle">Anti-Plagiasi</text>
</svg>
