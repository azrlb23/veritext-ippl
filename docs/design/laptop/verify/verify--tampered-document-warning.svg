<rect x="48" y="24" width="1344" height="68" rx="34" fill="#FFFFFF" fill-opacity="0.78" filter="url(#sh)"/><text x="80" y="65" font-size="21" font-weight="700" fill="#0B0F19">VeriText AI<tspan fill="#1A73D9">.</tspan></text><rect x="516.25" y="32" width="407.5" height="52" rx="26" fill="#F3F6FC"/><text x="562.875" y="63" font-size="15" font-weight="500" fill="#0B0F19" text-anchor="middle">Fitur</text><text x="652.5" y="63" font-size="15" font-weight="500" fill="#0B0F19" text-anchor="middle">Pipeline</text><text x="750.375" y="63" font-size="15" font-weight="500" fill="#0B0F19" text-anchor="middle">Koleksi</text><rect x="797.25" y="38" width="118.5" height="40" rx="20" fill="#0B0F19"/><text x="856.5" y="63" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="middle">Verifikasi</text><text x="1176" y="63" font-size="15" font-weight="500" fill="#0B0F19" text-anchor="start">Masuk</text><rect x="1240" y="36" width="120" height="44" rx="22" fill="#F3F6FC" data-role="secondary"/><text x="1300.0" y="63.22" font-size="14.5" font-weight="600" fill="#0B0F19" text-anchor="middle">Daftar</text><text x="48" y="126" font-size="12" font-weight="600" fill="#5B6475" text-anchor="start">Portal Integritas Publik  /  Verifikasi Sertifikat</text><text x="48" y="154" font-size="24" font-weight="600" fill="#0B0F19" text-anchor="start" letter-spacing="-0.4">Verifikasi Keaslian Sertifikat &amp; Naskah Ilmiah</text><text x="48" y="178" font-size="13.5" font-weight="400" fill="#5B6475" text-anchor="start">Pemeriksaan keaslian sertifikat audit naskah akademik berbasis tanda tangan digital SHA-256.</text><rect x="48" y="202" width="1020" height="56" rx="14" fill="#F3F6FC"/><rect x="64" y="253" width="988" height="3" rx="1.5" fill="#B91C1C" data-role="state-bar"/><text x="64" y="223" font-size="12" font-weight="500" fill="#B91C1C" text-anchor="start">Nomor UUID Sertifikat (36 karakter, contoh: 8f2a91c4-b7e1-4d90-a35c-7e6189df0123)</text><text x="64" y="244" font-size="15" font-weight="500" fill="#0B0F19" text-anchor="start">8f2a91c4-b7e1-4d90-a35c-7e6189df0123</text><rect x="1084" y="202" width="308" height="48" rx="24" fill="#F3F6FC" data-role="secondary"/><text x="1238.0" y="231.04" font-size="14" font-weight="600" fill="#0B0F19" text-anchor="middle">Verifikasi Sertifikat →</text><text x="48" y="272" font-size="12.5" font-weight="400" fill="#5B6475" text-anchor="start">Format UUID 36-karakter tertera pada footer sertifikat audit naskah VeriText AI.</text><text x="1392" y="272" font-size="12.5" font-weight="600" fill="#1560BD" text-anchor="end">📷 Beralih ke Pemindai QR Dokumen Fisik →</text><rect x="48" y="296" width="14" height="14" rx="4" fill="#F3F6FC"/><text x="72" y="307.5" font-size="13.5" font-weight="600" fill="#0B0F19" text-anchor="start">Hasil Verifikasi Kriptografis Naskah</text><text x="367.88" y="307.5" font-size="12.5" font-weight="400" fill="#5B6475" text-anchor="start">ID: 8f2a91c4-b7e1-4d90-a35c-7e6189df0123</text><text x="1186.25" y="307.5" font-size="12.5" font-weight="500" fill="#5B6475" text-anchor="end">Status Integritas</text><text x="1392" y="307.5" font-size="13.5" font-weight="600" fill="#B91C1C" text-anchor="end">Checksum Mismatch (Batal)</text><rect x="48" y="330" width="880" height="630" rx="20" fill="#FFFFFF" fill-opacity="0.78" filter="url(#sh)"/><rect x="72" y="354" width="14" height="14" rx="4" fill="#F3F6FC"/><text x="96" y="365.5" font-size="12.5" font-weight="600" fill="#0B0F19" text-anchor="start">INTEGRITAS DOKUMEN</text><rect x="236.5" y="352" width="162.16" height="20" rx="10" fill="#F3F6FC"/><text x="317.58" y="366" font-size="12" font-weight="500" fill="#5B6475" text-anchor="middle">Modifikasi Terdeteksi</text><text x="408.65999999999997" y="365.5" font-size="12" font-weight="400" fill="#5B6475" text-anchor="start">Ketidaksesuaian Hash</text><text x="876" y="365.5" font-size="13" font-weight="600" fill="#5B6475" text-anchor="end">···</text><text x="904" y="365.5" font-size="14" font-weight="500" fill="#5B6475" text-anchor="end">···</text><text x="72" y="402" font-size="18" font-weight="600" fill="#B91C1C" text-anchor="start">Peringatan: Naskah Telah Dimodifikasi Pasca-Audit</text><text x="72" y="426" font-size="13.5" font-weight="500" fill="#B91C1C" text-anchor="start">Nilai hash SHA-256 berkas fisik berbeda dari rekaman asli saat sertifikat diterbitkan. Dokumen tidak sah.</text><line x1="72" y1="458" x2="904" y2="458" stroke="#E4E8F0" stroke-width="1"/><text x="72" y="484" font-size="12" font-weight="600" fill="#5B6475" text-anchor="start">HASH RESMI TERDAFTAR (LEDGER 03 NOV 2026):</text><text x="904" y="484" font-size="12" font-weight="600" fill="#15803D" text-anchor="end">STATUS: ASLI TERCATAT</text><text x="72" y="506" font-size="12.5" font-weight="600" fill="#0B0F19" text-anchor="start">e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855</text><line x1="72" y1="526" x2="904" y2="526" stroke="#E4E8F0" stroke-width="1"/><text x="72" y="554" font-size="12" font-weight="600" fill="#5B6475" text-anchor="start">HASH BERKAS YANG DIUJI SAAT INI (MODIFIKASI):</text><text x="904" y="554" font-size="12" font-weight="600" fill="#B91C1C" text-anchor="end">STATUS: BERBEDA (BATAL)</text><text x="72" y="576" font-size="12.5" font-weight="600" fill="#B91C1C" text-anchor="start">a71b28d5f3094892c902781bcf739481bc920381749204918239017238120391</text><line x1="72" y1="596" x2="904" y2="596" stroke="#E4E8F0" stroke-width="1"/><text x="72" y="626" font-size="12" font-weight="600" fill="#5B6475" text-anchor="start">RINGKASAN ANOMALI &amp; PERUBAHAN ISI NASKAH (FORENSIC DIFF):</text><text x="72" y="652" font-size="12.5" font-weight="600" fill="#B91C1C" text-anchor="start">•  Halaman 4, Alinea 2:</text><text x="268" y="652" font-size="12.5" font-weight="400" fill="#0B0F19" text-anchor="start">Teks hasil pengujian ditambahkan 3 alinea baru tanpa verifikasi ulang sitasi.</text><line x1="72" y1="674" x2="904" y2="674" stroke="#E4E8F0" stroke-width="1"/><text x="72" y="698" font-size="12.5" font-weight="600" fill="#B91C1C" text-anchor="start">•  Halaman 7, Tabel 3:</text><text x="268" y="698" font-size="12.5" font-weight="400" fill="#0B0F19" text-anchor="start">Angka statistik signifikansi diubah secara manual dari 14% menjadi 42%.</text><line x1="72" y1="720" x2="904" y2="720" stroke="#E4E8F0" stroke-width="1"/><text x="72" y="744" font-size="12.5" font-weight="600" fill="#B91C1C" text-anchor="start">•  Halaman 12, Bibliografi:</text><text x="268" y="744" font-size="12.5" font-weight="400" fill="#0B0F19" text-anchor="start">Urutan referensi jurnal dan nomor DOI dimodifikasi setelah audit selesai.</text><line x1="72" y1="766" x2="904" y2="766" stroke="#E4E8F0" stroke-width="1"/><text x="72" y="810" font-size="12.5" font-weight="600" fill="#B91C1C" text-anchor="start">Pemberitahuan Hukum: Perubahan isi naskah membatalkan sertifikat ini secara otomatis.</text><text x="72" y="834" font-size="12.5" font-weight="400" fill="#5B6475" text-anchor="start">Segala bentuk penggunaan sertifikat ini untuk keperluan kelulusan / yudisium dianggap tidak sah.</text><rect x="72" y="876" width="260" height="48" rx="24" fill="#F3F6FC" data-role="secondary"/><text x="202.0" y="905.04" font-size="14" font-weight="600" fill="#0B0F19" text-anchor="middle">Bandingkan Versi Naskah</text><rect x="358" y="888" width="138.32" height="24" rx="12" fill="#F3F6FC"/><text x="427.15999999999997" y="904" font-size="12" font-weight="500" fill="#5B6475" text-anchor="middle">Forensik Checksum</text><rect x="504.32" y="888" width="138.32" height="24" rx="12" fill="#F3F6FC"/><text x="573.48" y="904" font-size="12" font-weight="500" fill="#5B6475" text-anchor="middle">Integritas Naskah</text><rect x="952" y="330" width="440" height="630" rx="20" fill="#FFFFFF" fill-opacity="0.78" filter="url(#sh)"/><rect x="976" y="354" width="14" height="14" rx="4" fill="#F3F6FC"/><text x="1000" y="365.5" font-size="12.5" font-weight="600" fill="#0B0F19" text-anchor="start">ARSIP ASLI</text><rect x="1082.5" y="352" width="106.47999999999999" height="20" rx="10" fill="#F3F6FC"/><text x="1135.74" y="366" font-size="12" font-weight="500" fill="#5B6475" text-anchor="middle">Blok #182.904</text><text x="1198.98" y="365.5" font-size="12" font-weight="400" fill="#5B6475" text-anchor="start">ITN Jakarta</text><text x="1340" y="365.5" font-size="13" font-weight="600" fill="#5B6475" text-anchor="end">···</text><text x="1368" y="365.5" font-size="14" font-weight="500" fill="#5B6475" text-anchor="end">···</text><text x="976" y="402" font-size="17" font-weight="600" fill="#0B0F19" text-anchor="start">Metadata Arsip Naskah</text><text x="976" y="426" font-size="13" font-weight="400" fill="#5B6475" text-anchor="start">Data arsip naskah asli yang tersimpan dalam repositori konsorsium perguruan tinggi.</text><line x1="976" y1="458" x2="1368" y2="458" stroke="#E4E8F0" stroke-width="1"/><text x="976" y="498" font-size="12.5" font-weight="400" fill="#5B6475" text-anchor="start">ID Registrasi</text><text x="1368" y="498" font-size="12.5" font-weight="600" fill="#0B0F19" text-anchor="end">VT-2026-ITN-SKR-0892</text><line x1="976" y1="512" x2="1368" y2="512" stroke="#E4E8F0" stroke-width="1"/><text x="976" y="542" font-size="12.5" font-weight="400" fill="#5B6475" text-anchor="start">Penulis Asli</text><text x="1368" y="542" font-size="12.5" font-weight="600" fill="#0B0F19" text-anchor="end">Rizky Pratama (11241045)</text><line x1="976" y1="556" x2="1368" y2="556" stroke="#E4E8F0" stroke-width="1"/><text x="976" y="586" font-size="12.5" font-weight="400" fill="#5B6475" text-anchor="start">Waktu Audit Asli</text><text x="1368" y="586" font-size="12.5" font-weight="600" fill="#0B0F19" text-anchor="end">03 Nov 2026, 09.12 WIB</text><line x1="976" y1="600" x2="1368" y2="600" stroke="#E4E8F0" stroke-width="1"/><text x="976" y="630" font-size="12.5" font-weight="400" fill="#5B6475" text-anchor="start">Skor Asli</text><text x="1368" y="630" font-size="12.5" font-weight="600" fill="#0B0F19" text-anchor="end">18,4% (Lolos Batas Uji)</text><line x1="976" y1="644" x2="1368" y2="644" stroke="#E4E8F0" stroke-width="1"/><text x="976" y="690" font-size="12" font-weight="600" fill="#5B6475" text-anchor="start">TINDAKAN EVALUATOR &amp; DEKANAT:</text><text x="976" y="716" font-size="12.5" font-weight="400" fill="#5B6475" text-anchor="start">Dosen pembimbing dan panitia ujian disarankan mengunduh berkas salinan naskah asli versi arsip ledger.</text><rect x="976" y="780" width="392" height="48" rx="24" fill="url(#gDark)" filter="url(#sh-btn)" data-role="primary"/><text x="1172.0" y="809.04" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">Unduh Berkas Asli Terarsip 🠗</text><text x="1172" y="854" font-size="13" font-weight="600" fill="#1560BD" text-anchor="middle">Eskalasi ke Komisi Etik Kampus →</text><rect x="976" y="888" width="110.47999999999999" height="24" rx="12" fill="#F3F6FC"/><text x="1031.24" y="904" font-size="12" font-weight="500" fill="#5B6475" text-anchor="middle">Arsip Dokumen</text><rect x="1094.48" y="888" width="96.55999999999999" height="24" rx="12" fill="#F3F6FC"/><text x="1142.76" y="904" font-size="12" font-weight="500" fill="#5B6475" text-anchor="middle">Komisi Etik</text>
