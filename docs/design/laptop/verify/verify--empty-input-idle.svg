<linearGradient id="gHero" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1A73D9"/><stop offset="1" stop-color="#3B5BDB"/></linearGradient>
<linearGradient id="gFilter" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1A73D9"/><stop offset="1" stop-color="#3B5BDB"/></linearGradient>
<linearGradient id="gDark" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B0F19"/><stop offset="1" stop-color="#3A3A40"/></linearGradient>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="2"/></pattern>
<filter id="sh-hero" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#1A73D9" flood-opacity="0.28"/></filter>
</defs>
<rect x="0" y="0" width="1440" height="1020" fill="url(#gBg)"/><g filter="url(#orb)"><circle cx="1240" cy="220" r="250" fill="#3B82F6" fill-opacity="0.32"/><circle cx="180" cy="760" r="270" fill="#22D3EE" fill-opacity="0.3"/><circle cx="1180" cy="1180" r="250" fill="#A78BFA" fill-opacity="0.3"/></g>
<rect x="48" y="24" width="1344" height="68" rx="34" fill="#FFFFFF" fill-opacity="0.78" filter="url(#sh)"/><text x="80" y="65" font-size="21" font-weight="700" fill="#0B0F19">VeriText AI<tspan fill="#1A73D9">.</tspan></text><rect x="516.25" y="32" width="407.5" height="52" rx="26" fill="#F3F6FC"/><text x="562.875" y="63" font-size="15" font-weight="500" fill="#0B0F19" text-anchor="middle">Fitur</text><text x="652.5" y="63" font-size="15" font-weight="500" fill="#0B0F19" text-anchor="middle">Pipeline</text><text x="750.375" y="63" font-size="15" font-weight="500" fill="#0B0F19" text-anchor="middle">Koleksi</text><rect x="797.25" y="38" width="118.5" height="40" rx="20" fill="#0B0F19"/><text x="856.5" y="63" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="middle">Verifikasi</text><text x="1176" y="63" font-size="15" font-weight="500" fill="#0B0F19" text-anchor="start">Masuk</text><rect x="1240" y="36" width="120" height="44" rx="22" fill="#F3F6FC" data-role="secondary"/><text x="1300.0" y="63.22" font-size="14.5" font-weight="600" fill="#0B0F19" text-anchor="middle">Daftar</text><text x="48" y="126" font-size="12" font-weight="600" fill="#5B6475" text-anchor="start">Portal Integritas Publik  /  Verifikasi Sertifikat</text><text x="48" y="154" font-size="24" font-weight="600" fill="#0B0F19" text-anchor="start" letter-spacing="-0.4">Verifikasi Keaslian Sertifikat &amp; Naskah Ilmiah</text><text x="48" y="178" font-size="13.5" font-weight="400" fill="#5B6475" text-anchor="start">Pemeriksaan keaslian sertifikat audit naskah akademik berbasis tanda tangan digital SHA-256.</text><rect x="48" y="202" width="1020" height="56" rx="14" fill="#F3F6FC"/><text x="64" y="223" font-size="12" font-weight="500" fill="#5B6475" text-anchor="start">Nomor UUID Sertifikat (36 karakter, contoh: 8f2a91c4-b7e1-4d90-a35c-7e6189df0123)</text><text x="64" y="244" font-size="15" font-weight="500" fill="#0B0F19" text-anchor="start"></text><rect x="1084" y="202" width="308" height="48" rx="24" fill="url(#gDark)" filter="url(#sh-btn)" data-role="primary"/><text x="1238.0" y="231.04" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">Verifikasi Sertifikat →</text><text x="48" y="272" font-size="12.5" font-weight="400" fill="#5B6475" text-anchor="start">Format UUID 36-karakter tertera pada footer sertifikat audit naskah VeriText AI.</text><text x="1392" y="272" font-size="12.5" font-weight="600" fill="#1560BD" text-anchor="end">📷 Beralih ke Pemindai QR Dokumen Fisik →</text><rect x="48" y="296" width="14" height="14" rx="4" fill="#F3F6FC"/><text x="72" y="307.5" font-size="13.5" font-weight="600" fill="#0B0F19" text-anchor="start">Standar &amp; Jaringan Integritas Naskah</text><text x="367.88" y="307.5" font-size="12.5" font-weight="400" fill="#5B6475" text-anchor="start">3 Kluster Aktif</text><text x="1311.53" y="307.5" font-size="12.5" font-weight="500" fill="#5B6475" text-anchor="end">Total Terindeks</text><text x="1392" y="307.5" font-size="13.5" font-weight="600" fill="#15803D" text-anchor="end">1.420.850</text><rect x="48" y="330" width="432" height="276" rx="20" fill="#FFFFFF" fill-opacity="0.78" filter="url(#sh)"/><rect x="68" y="354" width="14" height="14" rx="4" fill="#F3F6FC"/><text x="92" y="365.5" font-size="12.5" font-weight="600" fill="#0B0F19" text-anchor="start">MULTI-TIER</text><rect x="174.5" y="352" width="64.72" height="20" rx="10" fill="#F3F6FC"/><text x="206.86" y="366" font-size="12" font-weight="500" fill="#5B6475" text-anchor="middle">2 Mesin</text><text x="249.22" y="365.5" font-size="12" font-weight="400" fill="#5B6475" text-anchor="start">Leksikal &amp; Semantik</text><text x="460" y="365.5" font-size="14" font-weight="500" fill="#5B6475" text-anchor="end">···</text><text x="68" y="402" font-size="16" font-weight="600" fill="#0B0F19" text-anchor="start">Verifikasi Multi-Dimensi</text><text x="68" y="432" font-size="13" font-weight="400" fill="#5B6475" text-anchor="start">Pemeriksaan naskah melalui algoritma Winnowing n-gram dan</text><text x="68" y="452" font-size="13" font-weight="400" fill="#5B6475" text-anchor="start">pencarian semantik vektor IndoBERT 768-dimensi.</text><line x1="68" y1="550" x2="460" y2="550" stroke="#E4E8F0" stroke-width="1"/><rect x="68" y="566" width="131.35999999999999" height="24" rx="12" fill="#F3F6FC"/><text x="133.68" y="582" font-size="12" font-weight="500" fill="#5B6475" text-anchor="middle">Winnowing 50-Dim</text><rect x="207.35999999999999" y="566" width="110.47999999999999" height="24" rx="12" fill="#F3F6FC"/><text x="262.59999999999997" y="582" font-size="12" font-weight="500" fill="#5B6475" text-anchor="middle">pgvector HNSW</text><g transform="translate(448 578)" fill="none" stroke="#5B6475" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"><path d="M-5.5 -8H2L6 -4V8H-5.5Z"/><path d="M-2 0H2.5M-2 3.5H2.5"/></g><rect x="504" y="330" width="432" height="276" rx="20" fill="#FFFFFF" fill-opacity="0.78" filter="url(#sh)"/><rect x="524" y="354" width="14" height="14" rx="4" fill="#F3F6FC"/><text x="548" y="365.5" font-size="12.5" font-weight="600" fill="#0B0F19" text-anchor="start">SHA-256</text><rect x="608.75" y="352" width="106.47999999999999" height="20" rx="10" fill="#F3F6FC"/><text x="661.99" y="366" font-size="12" font-weight="500" fill="#5B6475" text-anchor="middle">Blok #182.904</text><text x="725.23" y="365.5" font-size="12" font-weight="400" fill="#5B6475" text-anchor="start">4 Node Konsensus</text><text x="916" y="365.5" font-size="14" font-weight="500" fill="#5B6475" text-anchor="end">···</text><text x="524" y="402" font-size="16" font-weight="600" fill="#0B0F19" text-anchor="start">Buku Besar Digital (Ledger)</text><text x="524" y="432" font-size="13" font-weight="400" fill="#5B6475" text-anchor="start">Pencatatan tanda tangan kriptografis Ed25519 dan checksum</text><text x="524" y="452" font-size="13" font-weight="400" fill="#5B6475" text-anchor="start">dokumen nirkolusi untuk jaminan orisinalitas.</text><line x1="524" y1="550" x2="916" y2="550" stroke="#E4E8F0" stroke-width="1"/><rect x="524" y="566" width="117.44" height="24" rx="12" fill="#F3F6FC"/><text x="582.72" y="582" font-size="12" font-weight="500" fill="#5B6475" text-anchor="middle">SHA-256 Digest</text><rect x="649.44" y="566" width="96.55999999999999" height="24" rx="12" fill="#F3F6FC"/><text x="697.72" y="582" font-size="12" font-weight="500" fill="#5B6475" text-anchor="middle">Ed25519 W3C</text><g transform="translate(904 578)" fill="none" stroke="#5B6475" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"><path d="M-5.5 -8H2L6 -4V8H-5.5Z"/><path d="M-2 0H2.5M-2 3.5H2.5"/></g><rect x="960" y="330" width="432" height="276" rx="20" fill="#FFFFFF" fill-opacity="0.78" filter="url(#sh)"/><rect x="980" y="354" width="14" height="14" rx="4" fill="#F3F6FC"/><text x="1004" y="365.5" font-size="12.5" font-weight="600" fill="#0B0F19" text-anchor="start">REGULASI DIKTI</text><rect x="1115.5" y="352" width="99.52" height="20" rx="10" fill="#F3F6FC"/><text x="1165.26" y="366" font-size="12" font-weight="500" fill="#5B6475" text-anchor="middle">Permendikbud</text><text x="1225.02" y="365.5" font-size="12" font-weight="400" fill="#5B6475" text-anchor="start">Presisi 99,98%</text><text x="1372" y="365.5" font-size="14" font-weight="500" fill="#5B6475" text-anchor="end">···</text><text x="980" y="402" font-size="16" font-weight="600" fill="#0B0F19" text-anchor="start">Kepatuhan &amp; Sertifikasi</text><text x="980" y="432" font-size="13" font-weight="400" fill="#5B6475" text-anchor="start">Sesuai pedoman Permendikbudristek No. 39/2021 dan standar</text><text x="980" y="452" font-size="13" font-weight="400" fill="#5B6475" text-anchor="start">format metadata sertifikat terbuka OpenCerts 2.0.</text><line x1="980" y1="550" x2="1372" y2="550" stroke="#E4E8F0" stroke-width="1"/><rect x="980" y="566" width="159.2" height="24" rx="12" fill="#F3F6FC"/><text x="1059.6" y="582" font-size="12" font-weight="500" fill="#5B6475" text-anchor="middle">Permendikbud 39/2021</text><rect x="1147.2" y="566" width="110.47999999999999" height="24" rx="12" fill="#F3F6FC"/><text x="1202.44" y="582" font-size="12" font-weight="500" fill="#5B6475" text-anchor="middle">OpenCerts 2.0</text><g transform="translate(1360 578)" fill="none" stroke="#5B6475" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"><path d="M-5.5 -8H2L6 -4V8H-5.5Z"/><path d="M-2 0H2.5M-2 3.5H2.5"/></g><rect x="48" y="628" width="14" height="14" rx="4" fill="#F3F6FC"/><text x="72" y="639.5" font-size="13.5" font-weight="600" fill="#0B0F19" text-anchor="start">Panduan Verifikasi bagi Penguji Sidang &amp; Mahasiswa</text><text x="477.5" y="639.5" font-size="12.5" font-weight="400" fill="#5B6475" text-anchor="start">3 Tahap Cepat</text><text x="1295.87" y="639.5" font-size="12.5" font-weight="500" fill="#5B6475" text-anchor="end">Layanan Publik</text><text x="1392" y="639.5" font-size="13.5" font-weight="600" fill="#5B6475" text-anchor="end">Online 24/7</text><rect x="48" y="662" width="432" height="276" rx="20" fill="#FFFFFF" fill-opacity="0.78" filter="url(#sh)"/><rect x="68" y="686" width="14" height="14" rx="4" fill="#F3F6FC"/><text x="92" y="697.5" font-size="12.5" font-weight="600" fill="#0B0F19" text-anchor="start">LANGKAH 01</text><rect x="174.5" y="684" width="85.6" height="20" rx="10" fill="#F3F6FC"/><text x="217.3" y="698" font-size="12" font-weight="500" fill="#5B6475" text-anchor="middle">Tahap Awal</text><text x="270.1" y="697.5" font-size="12" font-weight="400" fill="#5B6475" text-anchor="start">Format 8-4-4-4-12</text><text x="460" y="697.5" font-size="14" font-weight="500" fill="#5B6475" text-anchor="end">···</text><text x="68" y="734" font-size="16" font-weight="600" fill="#0B0F19" text-anchor="start">1. Periksa Nomor UUID</text><text x="68" y="764" font-size="13" font-weight="400" fill="#5B6475" text-anchor="start">Pastikan 36 karakter alfanumerik tercetak jelas di</text><text x="68" y="784" font-size="13" font-weight="400" fill="#5B6475" text-anchor="start">footer sertifikat naskah. Masukkan kode lengkap dengan</text><text x="68" y="804" font-size="13" font-weight="400" fill="#5B6475" text-anchor="start">tanda pemisah strip (-).</text><line x1="68" y1="882" x2="460" y2="882" stroke="#E4E8F0" stroke-width="1"/><rect x="68" y="898" width="117.44" height="24" rx="12" fill="#F3F6FC"/><text x="126.72" y="914" font-size="12" font-weight="500" fill="#5B6475" text-anchor="middle">Sensitif Huruf</text><rect x="193.44" y="898" width="103.52" height="24" rx="12" fill="#F3F6FC"/><text x="245.2" y="914" font-size="12" font-weight="500" fill="#5B6475" text-anchor="middle">Standar UUID</text><g transform="translate(448 910)" fill="none" stroke="#5B6475" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"><path d="M-5.5 -8H2L6 -4V8H-5.5Z"/><path d="M-2 0H2.5M-2 3.5H2.5"/></g><rect x="504" y="662" width="432" height="276" rx="20" fill="#FFFFFF" fill-opacity="0.78" filter="url(#sh)"/><rect x="524" y="686" width="14" height="14" rx="4" fill="#F3F6FC"/><text x="548" y="697.5" font-size="12.5" font-weight="600" fill="#0B0F19" text-anchor="start">LANGKAH 02</text><rect x="630.5" y="684" width="99.52" height="20" rx="10" fill="#F3F6FC"/><text x="680.26" y="698" font-size="12" font-weight="500" fill="#5B6475" text-anchor="middle">Kamera Fisik</text><text x="740.02" y="697.5" font-size="12" font-weight="400" fill="#5B6475" text-anchor="start">Pemindai Barcode</text><text x="916" y="697.5" font-size="14" font-weight="500" fill="#5B6475" text-anchor="end">···</text><text x="524" y="734" font-size="16" font-weight="600" fill="#0B0F19" text-anchor="start">2. Pindai Barcode QR</text><text x="524" y="764" font-size="13" font-weight="400" fill="#5B6475" text-anchor="start">Arahkan kamera smartphone ke QR Code sertifikat</text><text x="524" y="784" font-size="13" font-weight="400" fill="#5B6475" text-anchor="start">fisik untuk membuka tautan verifikasi resmi secara</text><text x="524" y="804" font-size="13" font-weight="400" fill="#5B6475" text-anchor="start">langsung tanpa mengetik.</text><line x1="524" y1="882" x2="916" y2="882" stroke="#E4E8F0" stroke-width="1"/><rect x="524" y="898" width="138.32" height="24" rx="12" fill="#F3F6FC"/><text x="593.16" y="914" font-size="12" font-weight="500" fill="#5B6475" text-anchor="middle">Resolusi Otomatis</text><rect x="670.3199999999999" y="898" width="82.63999999999999" height="24" rx="12" fill="#F3F6FC"/><text x="711.6399999999999" y="914" font-size="12" font-weight="500" fill="#5B6475" text-anchor="middle">URL Resmi</text><g transform="translate(904 910)" fill="none" stroke="#5B6475" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"><path d="M-5.5 -8H2L6 -4V8H-5.5Z"/><path d="M-2 0H2.5M-2 3.5H2.5"/></g><rect x="960" y="662" width="432" height="276" rx="20" fill="#FFFFFF" fill-opacity="0.78" filter="url(#sh)"/><rect x="980" y="686" width="14" height="14" rx="4" fill="#F3F6FC"/><text x="1004" y="697.5" font-size="12.5" font-weight="600" fill="#0B0F19" text-anchor="start">LANGKAH 03</text><rect x="1086.5" y="684" width="92.55999999999999" height="20" rx="10" fill="#F3F6FC"/><text x="1132.78" y="698" font-size="12" font-weight="500" fill="#5B6475" text-anchor="middle">Kriptografi</text><text x="1189.06" y="697.5" font-size="12" font-weight="400" fill="#5B6475" text-anchor="start">Konsensus Ledger</text><text x="1372" y="697.5" font-size="14" font-weight="500" fill="#5B6475" text-anchor="end">···</text><text x="980" y="734" font-size="16" font-weight="600" fill="#0B0F19" text-anchor="start">3. Rekonsiliasi Checksum</text><text x="980" y="764" font-size="13" font-weight="400" fill="#5B6475" text-anchor="start">Dosen penguji membandingkan nilai hash SHA-256 naskah</text><text x="980" y="784" font-size="13" font-weight="400" fill="#5B6475" text-anchor="start">dengan arsip ledger untuk memastikan naskah belum</text><text x="980" y="804" font-size="13" font-weight="400" fill="#5B6475" text-anchor="start">pernah diubah.</text><line x1="980" y1="882" x2="1372" y2="882" stroke="#E4E8F0" stroke-width="1"/><rect x="980" y="898" width="110.47999999999999" height="24" rx="12" fill="#F3F6FC"/><text x="1035.24" y="914" font-size="12" font-weight="500" fill="#5B6475" text-anchor="middle">64-Digit Hash</text><rect x="1098.48" y="898" width="82.63999999999999" height="24" rx="12" fill="#F3F6FC"/><text x="1139.8" y="914" font-size="12" font-weight="500" fill="#5B6475" text-anchor="middle">Nirkolusi</text><g transform="translate(1360 910)" fill="none" stroke="#5B6475" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"><path d="M-5.5 -8H2L6 -4V8H-5.5Z"/><path d="M-2 0H2.5M-2 3.5H2.5"/></g>
</svg>
