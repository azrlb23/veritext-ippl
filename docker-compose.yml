services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: veritext_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-veritext}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-veritext_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-veritext_ai}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-veritext} -d ${POSTGRES_DB:-veritext_ai}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - veritext-network

  redis:
    image: redis:7-alpine
    container_name: veritext_redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-VeriTextRedis2026Secure}"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-VeriTextRedis2026Secure}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - veritext-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  veritext-network:
    driver: bridge
